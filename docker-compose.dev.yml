services:
  # Override backend for development
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/vendor
    environment:
      - GO_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=rustfs_manager
      - DB_USER=rustfs_user
      - DB_PASSWORD=rustfs_password
      - JWT_SECRET=dev-jwt-secret
      - PORT=8080
    command: go run main.go

  # Override frontend for development
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api/v1
    command: npm run dev