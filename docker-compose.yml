services:
  postgres:
    image: postgres:15-alpine
    container_name: rustfs-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rustfs-manager

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/rustfs-manager-backend:latest
    container_name: rustfs-manager-api
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8080
      - GO_ENV=production
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    networks:
      - rustfs-manager

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/rustfs-manager-frontend:latest
    container_name: rustfs-manager-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rustfs-manager

  redis:
    image: redis:7-alpine
    container_name: rustfs-manager-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - rustfs-manager

volumes:
  postgres_data:
  redis_data:

networks:
  rustfs-manager:
    driver: bridge